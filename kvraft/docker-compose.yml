version: '3.8'

services:
  node0:
    build:
      context: .
      network: host
    network_mode: "host"
    environment:
      - NODE_ID=0
      - CONFIG_PATH=/app/cluster.json
      - DATA_DIR=/data
      - LOG_PATH=/logs/node0.log
      - RAFT_ELECTION_TIMEOUT_MIN=150
      - RAFT_ELECTION_TIMEOUT_RAND=150
      - RAFT_HEARTBEAT_TIMEOUT=50
      - RSM_SUBMIT_TIMEOUT=10
      - GRPC_BASE_DELAY=100
      - GRPC_MAX_DELAY=3
      - GRPC_MIN_CONNECT_TIMEOUT=2
      - METRICS_PORT_BASE=8080
      - CLERK_RPC_TIMEOUT=5
      - CLERK_RETRY_SLEEP=20
      - MAX_RAFT_STATE=1000000
    volumes:
      - ../cluster.json:/app/cluster.json:ro
      - node0_data:/data
      - logs_data:/logs

  node1:
    build:
      context: .
      network: host
    network_mode: "host"
    environment:
      - NODE_ID=1
      - CONFIG_PATH=/app/cluster.json
      - DATA_DIR=/data
      - LOG_PATH=/logs/node1.log
      - RAFT_ELECTION_TIMEOUT_MIN=150
      - RAFT_ELECTION_TIMEOUT_RAND=150
      - RAFT_HEARTBEAT_TIMEOUT=50
      - RSM_SUBMIT_TIMEOUT=10
      - GRPC_BASE_DELAY=100
      - GRPC_MAX_DELAY=3
      - GRPC_MIN_CONNECT_TIMEOUT=2
      - METRICS_PORT_BASE=8080
      - CLERK_RPC_TIMEOUT=5
      - CLERK_RETRY_SLEEP=20
      - MAX_RAFT_STATE=1000000
    volumes:
      - ../cluster.json:/app/cluster.json:ro
      - node1_data:/data
      - logs_data:/logs

  node2:
    build:
      context: .
      network: host
    network_mode: "host"
    environment:
      - NODE_ID=2
      - CONFIG_PATH=/app/cluster.json
      - DATA_DIR=/data
      - LOG_PATH=/logs/node2.log
      - RAFT_ELECTION_TIMEOUT_MIN=150
      - RAFT_ELECTION_TIMEOUT_RAND=150
      - RAFT_HEARTBEAT_TIMEOUT=50
      - RSM_SUBMIT_TIMEOUT=10
      - GRPC_BASE_DELAY=100
      - GRPC_MAX_DELAY=3
      - GRPC_MIN_CONNECT_TIMEOUT=2
      - METRICS_PORT_BASE=8080
      - CLERK_RPC_TIMEOUT=5
      - CLERK_RETRY_SLEEP=20
      - MAX_RAFT_STATE=1000000
    volumes:
      - ../cluster.json:/app/cluster.json:ro
      - node2_data:/data
      - logs_data:/logs

  node3:
    build:
      context: .
      network: host
    network_mode: "host"
    environment:
      - NODE_ID=3
      - CONFIG_PATH=/app/cluster.json
      - DATA_DIR=/data
      - LOG_PATH=/logs/node3.log
      - RAFT_ELECTION_TIMEOUT_MIN=150
      - RAFT_ELECTION_TIMEOUT_RAND=150
      - RAFT_HEARTBEAT_TIMEOUT=50
      - RSM_SUBMIT_TIMEOUT=10
      - GRPC_BASE_DELAY=100
      - GRPC_MAX_DELAY=3
      - GRPC_MIN_CONNECT_TIMEOUT=2
      - METRICS_PORT_BASE=8080
      - CLERK_RPC_TIMEOUT=5
      - CLERK_RETRY_SLEEP=20
      - MAX_RAFT_STATE=1000000
    volumes:
      - ../cluster.json:/app/cluster.json:ro
      - node3_data:/data
      - logs_data:/logs

  node4:
    build:
      context: .
      network: host
    network_mode: "host"
    environment:
      - NODE_ID=4
      - CONFIG_PATH=/app/cluster.json
      - DATA_DIR=/data
      - LOG_PATH=/logs/node4.log
      - RAFT_ELECTION_TIMEOUT_MIN=150
      - RAFT_ELECTION_TIMEOUT_RAND=150
      - RAFT_HEARTBEAT_TIMEOUT=50
      - RSM_SUBMIT_TIMEOUT=10
      - GRPC_BASE_DELAY=100
      - GRPC_MAX_DELAY=3
      - GRPC_MIN_CONNECT_TIMEOUT=2
      - METRICS_PORT_BASE=8080
      - CLERK_RPC_TIMEOUT=5
      - CLERK_RETRY_SLEEP=20
      - MAX_RAFT_STATE=1000000
    volumes:
      - ../cluster.json:/app/cluster.json:ro
      - node4_data:/data
      - logs_data:/logs

  prometheus:
    image: prom/prometheus:latest
    network_mode: "host"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    network_mode: "host"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    network_mode: "host"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    network_mode: "host"
    volumes:
      - logs_data:/logs:ro
      - ./config/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    command: -config.file=/etc/promtail/promtail-config.yml

volumes:
  logs_data:
  node0_data:
  node1_data:
  node2_data:
  node3_data:
  node4_data:
  grafana_data:
